[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbasket-commerce-core"
version = "0.1.0"
description = "Deterministic commerce core for a local cafe and specialty roastery"
requires-python = ">=3.12"
dependencies = [
  "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-google-genai==4.3.7",
  "langgraph==1.2.11",
  "langsmith>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]==2.10.1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  # AP2 pins cryptography 46; py_webauthn 3 requires 49. Version 2.7.1 is the
  # latest compatible stable verifier for the official AP2 SDK snapshot.
  "webauthn==2.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov>=7,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
