services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentbasket
      POSTGRES_USER: agentbasket
      POSTGRES_PASSWORD: agentbasket
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbasket -d agentbasket"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agentbasket_postgres:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agentbasket:agentbasket@postgres:5432/agentbasket
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  scheduled-worker:
    build: ./backend
    command: ["python", "-m", "app.workers.scheduled_purchases"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agentbasket:agentbasket@postgres:5432/agentbasket
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentbasket_postgres:
